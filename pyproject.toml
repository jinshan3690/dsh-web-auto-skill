[project]
name = "webskill"
version = "0.1.0"
description = "WebSkill - LLM + Playwright 网页操作 Skill 引擎"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48.0",
  "openai>=1.0.0",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29.0",
  "pillow>=10.0",
  "typer>=0.12",
]

[project.optional-dependencies]
# 推荐：ONNX 版中文向量，22MB，无需 PyTorch，任何 Python 版本都能装
# pip install -e ".[onnx]"
onnx = ["onnxruntime>=1.20", "tokenizers>=0.15", "huggingface_hub>=0.23"]
# 备选：sentence-transformers 版（需要 PyTorch，仅老版本 Python 有 wheel）
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
