<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>报销单填写 - 本地测试页</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 520px; margin: 40px auto; }
  .row { margin: 14px 0; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
  button { padding: 9px 18px; margin-right: 8px; cursor: pointer; }
</style>
</head>
<body>
<h2>差旅费报销单</h2>

<div class="row">
  <label>申请人</label>
  <input id="applicant" name="applicant" placeholder="请输入申请人姓名">
</div>

<div class="row">
  <label>出差事由</label>
  <input id="reason" name="reason" placeholder="请输入出差事由" required>
</div>

<div class="row">
  <label>报销金额</label>
  <input id="amount" name="amount" type="number" placeholder="请输入金额">
</div>

<div class="row">
  <label>费用类型</label>
  <select id="category" name="category">
    <option value="train">火车票</option>
    <option value="flight">机票</option>
    <option value="hotel">住宿</option>
  </select>
</div>

<div class="row">
  <button id="saveDraft">保存草稿</button>
  <button id="submit">提交申请</button>
  <button id="approve">审批通过</button>
</div>

<div id="result" style="margin-top:20px;color:#0a7;"></div>

<script>
document.getElementById('saveDraft').onclick = () => {
  document.getElementById('result').textContent = '草稿已保存';
};
document.getElementById('submit').onclick = () => {
  document.getElementById('result').textContent = '申请已提交';
};
document.getElementById('approve').onclick = () => {
  document.getElementById('result').textContent = '已审批通过';
};
</script>
</body>
</html>
